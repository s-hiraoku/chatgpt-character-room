<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>だらぱんの部屋</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23294b3f'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='48' fill='%23d7f2bb'%3E%E2%97%92%3C/text%3E%3C/svg%3E"
    />
    <!-- APP_STYLE -->
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">◒</span>
          <div>
            <p class="eyebrow">CHARACTER ROOM</p>
            <h1>だらぱんの部屋</h1>
          </div>
        </div>
        <span id="connection" class="connection">準備中</span>
      </header>
      <main class="workspace">
        <section class="room-panel" aria-labelledby="scene-heading">
          <div class="scene-topline">
            <div>
              <p class="eyebrow">MY LITTLE SPACE</p>
              <h2 id="scene-heading">夜のアトリエ</h2>
            </div>
            <label class="edit-toggle"
              ><input type="checkbox" id="edit-mode" checked />配置を編集</label
            >
          </div>
          <div
            class="stage"
            id="stage"
            data-background="night"
            aria-label="キャラクターの部屋"
          >
            <div class="room-art" aria-hidden="true">
              <div class="window">
                <span class="moon"></span><span class="skyline"></span>
              </div>
              <div class="light"></div>
              <div class="floor"></div>
              <div class="plant"><i></i><i></i><i></i><b></b></div>
            </div>
            <p class="scene-message">今日は、ここでひと休み。</p>
            <div class="actors" id="actors"></div>
            <p id="empty" class="empty" hidden>
              まだ誰もいません。<br />キャラを追加して、部屋を作ろう。
            </p>
            <span class="scene-tag">DARAPAN'S ATELIER</span>
          </div>
          <div class="scene-caption">
            <span>サイバーパンダのだらぱん</span><span id="count">—</span>
          </div>
          <section
            class="background-section"
            aria-labelledby="background-heading"
          >
            <h3 id="background-heading">背景を選ぶ</h3>
            <div id="backgrounds" class="background-options"></div>
          </section>
          <p class="hint">
            キャラをドラッグして配置。矢印キーでも移動できます。
          </p>
        </section>
        <aside class="inspector" aria-labelledby="inspector-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">CHARACTERS</p>
              <h2 id="inspector-heading">部屋の仲間</h2>
            </div>
            <span class="small-dot" aria-hidden="true"></span>
          </div>
          <div id="character-list" class="character-list"></div>
          <button type="button" id="add" class="add-button" disabled>
            ＋ キャラを追加
          </button>
          <label class="field-label" for="add-character">追加するキャラ</label
          ><select id="add-character"></select>
          <div id="selection" class="selection" hidden>
            <hr />
            <div class="selection-title">
              <h3 id="selected-name">だらぱん</h3>
              <span>配置の調整</span>
            </div>
            <label class="field-label" for="variant">バリエーション</label
            ><select id="variant"></select>
            <label class="range-label" for="size"
              >大きさ <output id="size-value"></output></label
            ><input id="size" type="range" min="20" max="70" step="1" />
            <label class="range-label" for="x"
              >左右 <output id="x-value"></output></label
            ><input id="x" type="range" min="10" max="90" step="1" />
            <label class="range-label" for="y"
              >上下 <output id="y-value"></output></label
            ><input id="y" type="range" min="45" max="96" step="1" />
            <label class="flip"
              ><input type="checkbox" id="flip" />左右を反転</label
            >
            <button type="button" id="remove" class="remove-button">
              このキャラを部屋から外す
            </button>
          </div>
          <div class="save-actions">
            <button type="button" id="save" disabled>配置を保存</button
            ><button type="button" id="load" disabled>配置を読み込む</button
            ><input
              id="load-file"
              type="file"
              accept="application/json,.json"
              hidden
            />
          </div>
          <p class="save-note">配置はJSONファイルに保存できます。</p>
        </aside>
      </main>
      <footer>
        <p id="status" role="status" aria-live="polite">
          部屋を準備しています。
        </p>
        <span class="footer-note">A LITTLE ROOM, YOUR OWN WORLD.</span>
      </footer>
    </div>
    <!-- APP_SCRIPT -->
  </body>
</html>
